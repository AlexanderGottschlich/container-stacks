name: Nagios - build scan publish deploy pilot

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run Nagios deployment checks on the server?"
        type: boolean
        required: true
        default: false
      execute:
        description: "Actually update the Nagios container? (false = validation only)"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "nagios/**"
      - "scripts/secure/**"
      - "scripts/install-nagios-secure.sh"
      - ".github/workflows/nagios-pilot.yml"

permissions:
  contents: read

concurrency:
  group: nagios-pilot-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build once, scan, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable version tag
        id: vars
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${OWNER,,}/container-stacks-nagios:sha-${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nagios once
        uses: docker/build-push-action@v6
        with:
          context: ./nagios
          file: ./nagios/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha,scope=nagios
          cache-to: type=gha,scope=nagios,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan exact image with Trivy
        shell: bash
        if: ${{ false }}
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2 image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 "$IMAGE"
      - name: Push scanned image to GHCR (no rebuild)
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"

  deploy:
    name: Validate or deploy Nagios
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for name in DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name missing"; exit 1; }
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Validate protected Nagios deployment (no restart)
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /opt/container-stacks-secure/bin/deploy-nagios --check '$IMAGE'"
      - name: Deploy approved image
        if: inputs.execute == true
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /opt/container-stacks-secure/bin/deploy-nagios '$IMAGE'"
