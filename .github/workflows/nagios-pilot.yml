
name: Nagios - SSH connectivity test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test SSH connection to production
    runs-on: ubuntu-latest
    environment: Naboo

    timeout-minutes: 5

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::error::DEPLOY_HOST is missing"
            exit 1
          fi

          if [[ -z "${DEPLOY_USER:-}" ]]; then
            echo "::error::DEPLOY_USER is missing"
            exit 1
          fi

          if [[ -z "${DEPLOY_KEY:-}" ]]; then
            echo "::error::DEPLOY_SSH_KEY is missing"
            exit 1
          fi

          if [[ -z "${KNOWN_HOSTS:-}" ]]; then
            echo "::error::DEPLOY_KNOWN_HOSTS is missing"
            exit 1
          fi

          echo "Deployment configuration is complete."
          echo "SSH user: $DEPLOY_USER"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" \
            > "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Verify private SSH key format
          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "SSH identity configured successfully."

      - name: Test SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          echo "Testing SSH connection..."

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'whoami && hostname && pwd && id'

          echo "SSH connection successful."
