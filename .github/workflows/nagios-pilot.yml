name: Nagios - build scan publish deploy pilot

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the production server after successful publish?"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'nagios/**'
      - '.github/workflows/nagios-pilot.yml'

permissions:
  contents: read

concurrency:
  group: nagios-pilot-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image coordinates
        id: vars
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/container-stacks-nagios:sha-${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Nagios
        uses: docker/build-push-action@v6
        with:
          context: ./nagios
          file: ./nagios/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.vars.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan published image (nonblocking during pilot)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2 image \
            --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 "$IMAGE"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Install verified SSH identity
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy approved Nagios image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/deploy-nagios-ghcr.sh "$IMAGE"
