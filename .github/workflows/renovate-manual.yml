name: Renovate - manual scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v44.2.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: AlexanderGottschlich/container-stacks
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info