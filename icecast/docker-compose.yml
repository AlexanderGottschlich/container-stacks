services:
  icecast:
    image: moul/icecast:latest@sha256:b35cd6367327335b51b989c277e6feaff7cd61d65846ec7fee361c6eb1cea620
    platform: linux/amd64
    container_name: icecast
    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - logs:/var/log/icecast2
      - /etc/localtime:/etc/localtime:ro

    environment:
      ICECAST_SOURCE_PASSWORD: changeme
      ICECAST_ADMIN_PASSWORD: changeme
      ICECAST_PASSWORD: changeme
      ICECAST_RELAY_PASSWORD: changeme

    networks:
      - mediahub_net

  liquidsoap_radio:
    image: savonet/liquidsoap:v2.3.0@sha256:925b69f1f476c6bac9b111257f2cf064ba4187056797020d3b1f9913ff0d0e8c
    container_name: icecast-liquidsoap-radio
    restart: unless-stopped
    depends_on:
      - icecast
    volumes:
      - "/Users/awiechert/Downloads/Foo Fighters - Discography:/music/foofighters:ro"
#      - "/home/agottschlich/Nextcloud/music/Thievery Corporation:/music/thievery:ro"
      - "./radio.liq:/etc/liquidsoap/radio.liq:ro"
    environment:
      - TZ=Europe/Berlin
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    networks:
      - mediahub_net



volumes:
  logs:

networks:
  mediahub_net:
    external: true
