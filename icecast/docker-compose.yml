#      context: ./admin
#    container_name: radio_admin
#    depends_on:
#      - icecast
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
#    ports:
#      - "8080:8080"

  liquidsoap_foo:
    image: savonet/liquidsoap:v2.3.0
    container_name: icecast-liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast

    volumes:
      - "/Users/awiechert/Downloads/Foo Fighters - Discography:/music:ro"
      - "./radio.liq:/etc/liquidsoap/radio.liq:ro"

    environment:
      - TZ=Europe/Berlin
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]

volumes:
  logs:
