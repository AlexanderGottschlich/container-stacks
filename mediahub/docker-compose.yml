services:
  mediahub-web:
    image: nginx:alpine
    container_name: mediahub-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mediahub_net

networks:
  mediahub_net:
    external: true
