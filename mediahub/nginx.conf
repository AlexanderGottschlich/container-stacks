events {}

http {
  # Für WebSocket Upgrade (Jellyfin optional)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # ---------- Static UI ----------
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # ---------- Icecast (Same-Origin) ----------
    # Stream
    location = /radio {
      proxy_pass http://icecast:8000/radio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # Status JSON
    location = /status-json.xsl {
      proxy_pass http://icecast:8000/status-json.xsl;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # ---------- Optional: Jellyfin unter /jellyfin/ ----------
    # Wenn du Jellyfin ebenfalls im mediahub_net hast und der Service/Container "jellyfin" heißt:
    #
    # location /jellyfin/ {
    #   proxy_pass http://jellyfin:8096/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection $connection_upgrade;
    # }
  }
}
