version: "3.8"

services:
  sensu-backend:
    image: sensu/sensu:${SENSU_VERSION:-6.14.2}
    container_name: sensu-backend
    restart: unless-stopped
    networks:
      - proxy_net
      - sensu_net
    volumes:
      - sensu_state:/var/lib/sensu
    environment:
      TZ: Europe/Berlin
      # Used only to bootstrap a NEW backend. Existing credentials in
      # sensu_state are not changed by these variables.
      SENSU_BACKEND_CLUSTER_ADMIN_USERNAME: ${SENSU_ADMIN_USER}
      SENSU_BACKEND_CLUSTER_ADMIN_PASSWORD: ${SENSU_ADMIN_PASS}
    command: >
      sensu-backend start
      --state-dir /var/lib/sensu/sensu-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.sensu.rule=Host(`${SENSU_HOSTNAME:-sensu.elastic2ls.com}`)"
      - "traefik.http.routers.sensu.entrypoints=websecure"
      - "traefik.http.routers.sensu.tls=true"
      - "traefik.http.routers.sensu.tls.certresolver=le"
      - "traefik.http.services.sensu.loadbalancer.server.port=3000"

  # Public/external checks. This agent deliberately does NOT join proxy_net.
  # Its traffic to the host's public IP therefore leaves via sensu_net instead
  # of trying to hairpin through the Traefik-facing bridge.
  sensu-agent-external:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        SENSU_VERSION: ${SENSU_VERSION:-6.14.2}
    image: elastic2ls/sensu-agent:${SENSU_VERSION:-6.14.2}
    container_name: sensu-agent-external
    restart: unless-stopped
    depends_on:
      - sensu-backend
    environment:
      TZ: Europe/Berlin
    command: >
      sensu-agent start
      --name monitoring-external
      --backend-url ws://sensu-backend:8081
      --subscriptions external
      --cache-dir /var/lib/sensu
    volumes:
      - sensu_agent_external_state:/var/lib/sensu
    networks:
      - sensu_net

  # Internal Docker-network checks. This agent can resolve/reach containers on
  # proxy_net (currently pihole and unbound) but receives no public checks.
  sensu-agent-internal:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        SENSU_VERSION: ${SENSU_VERSION:-6.14.2}
    image: elastic2ls/sensu-agent:${SENSU_VERSION:-6.14.2}
    container_name: sensu-agent-internal
    restart: unless-stopped
    depends_on:
      - sensu-backend
    environment:
      TZ: Europe/Berlin
    command: >
      sensu-agent start
      --name monitoring-internal
      --backend-url ws://sensu-backend:8081
      --subscriptions internal
      --cache-dir /var/lib/sensu
    volumes:
      - sensu_agent_internal_state:/var/lib/sensu
    networks:
      - sensu_net
      - proxy_net

  # One-shot Configuration-as-Code loader.
  sensu-config:
    image: sensu/sensu:${SENSU_VERSION:-6.14.2}
    container_name: sensu-config
    depends_on:
      - sensu-backend
    restart: "no"
    networks:
      - sensu_net
    volumes:
      - ./resources:/resources:ro
      - ./scripts/apply-config.sh:/usr/local/bin/apply-config.sh:ro
    environment:
      SENSU_API_URL: http://sensu-backend:8080
      SENSU_ADMIN_USER: ${SENSU_ADMIN_USER}
      SENSU_ADMIN_PASS: ${SENSU_ADMIN_PASS}
    entrypoint: ["/bin/sh", "/usr/local/bin/apply-config.sh"]

networks:
  proxy_net:
    external: true
  sensu_net:
    driver: bridge

volumes:
  sensu_state:
  sensu_agent_external_state:
  sensu_agent_internal_state:
