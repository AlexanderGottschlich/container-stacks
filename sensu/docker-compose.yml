version: "3.8"

services:
  sensu-backend:
    image: sensu/sensu:latest
    container_name: sensu-backend
    restart: unless-stopped
    networks:
      - proxy_net
      - sensu_net
    volumes:
      - sensu_state:/var/lib/sensu
    environment:
      TZ: Europe/Berlin
    command: >
      sh -c "
      sensu-backend start
      "
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.sensu.rule=Host(`sensu.elastic2ls.com`)"
      - "traefik.http.routers.sensu.entrypoints=websecure"
      - "traefik.http.routers.sensu.tls=true"
      - "traefik.http.routers.sensu.tls.certresolver=le"
      - "traefik.http.services.sensu.loadbalancer.server.port=3000"

  sensu-init:
    image: sensu/sensu:latest
    container_name: sensu-init
    depends_on:
      - sensu-backend
    networks:
      - sensu_net
    volumes:
      - sensu_state:/var/lib/sensu
    environment:
      SENSU_ADMIN_USER: ${SENSU_ADMIN_USER}
      SENSU_ADMIN_PASS: ${SENSU_ADMIN_PASS}
    entrypoint: >
      sh -c "
      echo 'waiting for backend…';
      sleep 5;
      sensu-backend init
        --cluster-admin-username \"$SENSU_ADMIN_USER\"
        --cluster-admin-password \"$SENSU_ADMIN_PASS\"
        --ignore-already-initialized
      "

networks:
  proxy_net:
    external: true
  sensu_net:
    driver: bridge

volumes:
  sensu_state:
