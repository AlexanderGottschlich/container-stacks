---
type: CheckConfig
api_version: core/v2
metadata:
  name: elastic2ls-website-availability
  labels:
    managed_by: git
    source: nagios-migration
  annotations:
    nagios_service_description: Website availability
    target: www.elastic2ls.com
spec:
  command: /opt/sensu/checks/check_http.sh --host www.elastic2ls.com --path / --status
    200 --follow
  interval: 300
  timeout: 20
  publish: true
  round_robin: true
  proxy_entity_name: www.elastic2ls.com
  subscriptions:
  - monitoring
---
type: CheckConfig
api_version: core/v2
metadata:
  name: elastic2ls-public-dns
  labels:
    managed_by: git
    source: nagios-migration
  annotations:
    nagios_service_description: Public DNS
    target: www.elastic2ls.com
spec:
  command: /opt/sensu/checks/check_dns.sh --host www.elastic2ls.com
  interval: 1800
  timeout: 20
  publish: true
  round_robin: true
  proxy_entity_name: www.elastic2ls.com
  subscriptions:
  - monitoring
---
type: CheckConfig
api_version: core/v2
metadata:
  name: elastic2ls-tls-certificate
  labels:
    managed_by: git
    source: nagios-migration
  annotations:
    nagios_service_description: TLS certificate
    target: www.elastic2ls.com
spec:
  command: /opt/sensu/checks/check_tls.sh --host www.elastic2ls.com --warning 30 --critical
    14
  interval: 43200
  timeout: 20
  publish: true
  round_robin: true
  proxy_entity_name: www.elastic2ls.com
  subscriptions:
  - monitoring
