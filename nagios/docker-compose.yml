version: "3.8"

services:
  nagios:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NAGIOS_VERSION: "4.5.14"
        NAGIOS_PLUGINS_VERSION: "2.5"

    image: elastic2ls/nagios:4.5.14
    container_name: nagios
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin
      NAGIOSADMIN_PASSWORD: ${NAGIOSADMIN_PASSWORD}

    # Nagios object configuration is NOT mounted here. It is part of the image.
    # Only runtime state survives container recreation.
    volumes:
      - nagios_var:/usr/local/nagios/var

    # Keep the image filesystem read-only at runtime. Runtime files needed by
    # Apache and the generated Basic-Auth file live on tmpfs.
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/log/apache2
      - /var/lib/php/sessions

    # Two networks are intentional:
    # - proxy_net: Traefik reaches the Nagios web UI here.
    # - nagios_egress: default gateway for monitoring external/public targets.
    #
    # This prevents checks for the host's own public IP from originating on
    # proxy_net, where Docker's published-port DNAT rule excludes traffic
    # arriving from that same bridge.
    networks:
      proxy_net:
        gw_priority: 0
      nagios_egress:
        gw_priority: 1

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"

      - "traefik.http.routers.nagios.rule=Host(`${NAGIOS_HOSTNAME}`)"
      - "traefik.http.routers.nagios.entrypoints=websecure"
      - "traefik.http.routers.nagios.tls=true"
      - "traefik.http.routers.nagios.tls.certresolver=le"

      - "traefik.http.services.nagios.loadbalancer.server.port=80"

      # Nagios' Apache UI lives below /nagios/.
      - "traefik.http.middlewares.nagios-root.redirectregex.regex=^https?://([^/]+)/?$$"
      - "traefik.http.middlewares.nagios-root.redirectregex.replacement=https://$${1}/nagios/"
      - "traefik.http.middlewares.nagios-root.redirectregex.permanent=true"
      - "traefik.http.routers.nagios.middlewares=nagios-root@docker"

networks:
  proxy_net:
    external: true

  nagios_egress:
    driver: bridge

volumes:
  nagios_var:
