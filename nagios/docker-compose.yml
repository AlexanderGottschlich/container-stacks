version: "3.8"

services:
  nagios:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NAGIOS_VERSION: "4.5.14"
        NAGIOS_PLUGINS_VERSION: "2.5"

    image: elastic2ls/nagios:4.5.14
    container_name: nagios
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin
      NAGIOSADMIN_PASSWORD: ${NAGIOSADMIN_PASSWORD}
      # Used by the route setup in the image. The matching external bridge is
      # created idempotently by scripts/start-nagios.sh.
      NAGIOS_EGRESS_GATEWAY: ${NAGIOS_EGRESS_GATEWAY:-172.30.250.1}

    volumes:
      - nagios_var:/usr/local/nagios/var

    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/log/apache2
      - /var/lib/php/sessions

    # Required only because this legacy Docker Engine has no gw-priority.
    # The container sets its default route explicitly to nagios_egress.
    cap_add:
      - NET_ADMIN

    # Both networks are attached by Compose before the container starts.
    # This is important for Traefik: it can resolve the backend on proxy_net
    # immediately and never observes a transient egress-only container.
    # Legacy Docker cannot express gateway priority, so the entrypoint
    # explicitly restores nagios_egress as the default route.
    networks:
      - nagios_egress
      - proxy_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"

      - "traefik.http.routers.nagios.rule=Host(`${NAGIOS_HOSTNAME}`)"
      - "traefik.http.routers.nagios.entrypoints=websecure"
      - "traefik.http.routers.nagios.tls=true"
      - "traefik.http.routers.nagios.tls.certresolver=le"

      - "traefik.http.services.nagios.loadbalancer.server.port=80"

      - "traefik.http.middlewares.nagios-root.redirectregex.regex=^https?://([^/]+)/?$$"
      - "traefik.http.middlewares.nagios-root.redirectregex.replacement=https://$${1}/nagios/"
      - "traefik.http.middlewares.nagios-root.redirectregex.permanent=true"
      - "traefik.http.routers.nagios.middlewares=nagios-root@docker"

networks:
  # Lifecycle of nagios_egress is managed by scripts/start-nagios.sh so the
  # bridge has stable IPAM on legacy Docker. Both networks are nevertheless
  # attached by Compose before the Nagios container starts.
  nagios_egress:
    external: true

  proxy_net:
    external: true

volumes:
  nagios_var:
