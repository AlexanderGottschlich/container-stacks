# Public UI: https://pi.elastic2ls.com
# DNS functionality is checked separately against the pihole and unbound
# containers on proxy_net.

define host {
    use                     generic-host
    host_name               pi.elastic2ls.com
    alias                   Pi-hole
    address                 152.53.46.232
    check_command           check_tcp!443
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    contact_groups          admins
}

define service {
    use                     generic-service
    host_name               pi.elastic2ls.com
    service_description     Pi-hole HTTPS endpoint
    # Pi-hole/reverse-proxy deployments may intentionally answer with a login
    # redirect or forbidden response while the public route itself is healthy.
    check_command           check_https_status!/admin/!200,301,302,401,403
}

define service {
    use                     generic-service
    host_name               pi.elastic2ls.com
    service_description     Public DNS A record
    check_command           check_public_dns_a
}

define service {
    use                     generic-service
    host_name               pi.elastic2ls.com
    service_description     TLS certificate
    check_command           check_https_certificate!30!14
    check_interval          60
    notification_interval   60
}

define service {
    use                     generic-service
    host_name               pi.elastic2ls.com
    service_description     Pi-hole DNS resolver
    check_command           check_dns_server!pihole!example.com
}

define service {
    use                     generic-service
    host_name               pi.elastic2ls.com
    service_description     Unbound recursive DNS
    check_command           check_unbound_dns!unbound!5335!example.com
}
