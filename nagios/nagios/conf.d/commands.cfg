# Repository-managed custom commands.

# Nextcloud application check.
# $HOSTADDRESS$ is the immutable public destination IP.
# $HOSTNAME$ remains the DNS name used for HTTP Host, TLS SNI and certificate
# verification.
define command {
    command_name    check_nextcloud_status
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -u /status.php -e 200 -s '"installed":true' -w 5 -c 10 -t 15
}

# Generic HTTPS certificate-expiry check against the public destination IP.
# ARG1 = warning threshold in days
# ARG2 = critical threshold in days
define command {
    command_name    check_https_certificate
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -C $ARG1$,$ARG2$ -t 15
}
