# Repository-managed custom commands.
# Public HTTPS hosts deliberately use an immutable public IP as $HOSTADDRESS$.
# $HOSTNAME$ is still used for HTTP Host, TLS SNI and certificate validation.

# Nextcloud application check.
define command {
    command_name    check_nextcloud_status
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -u /status.php -e 200 -s '"installed":true' -w 5 -c 10 -t 15
}

# Generic HTTPS endpoint check with one or more accepted HTTP status strings.
# ARG1 = URI
# ARG2 = comma-separated status strings, e.g. 200,301,302
define command {
    command_name    check_https_status
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -u $ARG1$ -e '$ARG2$' -w 5 -c 10 -t 15
}

# Generic HTTPS content check. Redirects are followed while sticking to the
# configured public IP, so checks cannot silently bypass the intended path.
# ARG1 = URI
# ARG2 = content string
define command {
    command_name    check_https_content
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -u $ARG1$ -f sticky -s '$ARG2$' -w 5 -c 10 -t 15
}

# Generic HTTPS certificate-expiry check against the public destination IP.
# ARG1 = warning threshold in days
# ARG2 = critical threshold in days
define command {
    command_name    check_https_certificate
    command_line    $USER1$/check_http -4 -I $HOSTADDRESS$ -H $HOSTNAME$ -S --sni --verify-host -C $ARG1$,$ARG2$ -t 15
}

# Verify that public DNS still points the hostname to its immutable expected IP.
define command {
    command_name    check_public_dns_a
    command_line    $USER1$/check_dns -H $HOSTNAME$ -a $HOSTADDRESS$ -w 1 -c 3 -t 5
}

# Functional DNS resolver check against an explicitly named DNS server.
# ARG1 = DNS server (Docker DNS name or IP)
# ARG2 = hostname to resolve
define command {
    command_name    check_dns_server
    command_line    $USER1$/check_dns -H $ARG2$ -s $ARG1$ -w 1 -c 3 -t 5
}


# Functional Unbound resolver check on its non-standard DNS port.
# ARG1 = DNS server (Docker DNS name or IP)
# ARG2 = DNS port (Pi-hole stack uses 5335)
# ARG3 = hostname to resolve
define command {
    command_name    check_unbound_dns
    command_line    $USER1$/check_unbound_dns $ARG1$ $ARG2$ $ARG3$
}

# External websites: resolve the hostname through public DNS instead of pinning
# the connection to the host's own public IP. Redirects are followed to the
# final HTTP 200 response.
define command {
    command_name    check_external_https
    command_line    $USER1$/check_http -4 -H $HOSTNAME$ -S --sni --verify-host -u $ARG1$ -f follow -e 200 -w 5 -c 10 -t 15
}

# Certificate expiry for external DNS-resolved websites.
# ARG1 = warning threshold in days
# ARG2 = critical threshold in days
define command {
    command_name    check_external_certificate
    command_line    $USER1$/check_http -4 -H $HOSTNAME$ -S --sni --verify-host -C $ARG1$,$ARG2$ -t 15
}

# Verify that an external website hostname resolves successfully. Unlike
# check_public_dns_a this intentionally does not pin an expected address.
define command {
    command_name    check_external_dns
    command_line    $USER1$/check_dns -H $HOSTNAME$ -w 1 -c 3 -t 5
}
