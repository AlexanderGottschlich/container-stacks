# Repository-managed custom commands.

# Nextcloud application check.  The public status.php endpoint should return
# HTTP 200 and report that Nextcloud is installed.
define command {
    command_name    check_nextcloud_status
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni --verify-host -u /status.php -e 200 -s '"installed":true' -w 5 -c 10 -t 15
}

# Generic HTTPS certificate-expiry check.
# ARG1 = warning threshold in days
# ARG2 = critical threshold in days
define command {
    command_name    check_https_certificate
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni --verify-host -C $ARG1$,$ARG2$ -t 15
}
