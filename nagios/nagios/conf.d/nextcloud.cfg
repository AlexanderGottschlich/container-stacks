# Test target: https://nc2.elastic2ls.com
# This file is copied into the Docker image at build time.
#
# The TCP connection is deliberately made to the public IP 152.53.46.232.
# nc2.elastic2ls.com is still used for HTTP Host, TLS SNI and certificate
# verification by commands.cfg.

define host {
    use                     generic-host
    host_name               nc2.elastic2ls.com
    alias                   Nextcloud nc2.elastic2ls.com
    address                 152.53.46.232
    check_command           check_nextcloud_status
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               nc2.elastic2ls.com
    service_description     Nextcloud external availability
    check_command           check_nextcloud_status
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               nc2.elastic2ls.com
    service_description     TLS certificate
    check_command           check_https_certificate!30!14
    check_interval          720
    retry_interval          60
    max_check_attempts      3
}
