# Test target: https://nc2.elastic2ls.com
# This file is copied into the Docker image at build time.

# For an Internet service, the host check intentionally tests the application
# endpoint instead of relying on ICMP/ping availability.
define host {
    use                     generic-host
    host_name               nc2.elastic2ls.com
    alias                   Nextcloud nc2.elastic2ls.com
    address                 nc2.elastic2ls.com
    check_command           check_nextcloud_status
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               nc2.elastic2ls.com
    service_description     Nextcloud status.php
    check_command           check_nextcloud_status
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               nc2.elastic2ls.com
    service_description     TLS certificate
    check_command           check_https_certificate!30!14
    check_interval          720
    retry_interval          60
    max_check_attempts      3
}
