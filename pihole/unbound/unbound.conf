server:
  verbosity: 1
interface: 0.0.0.0
port: 5335

do-ip4: yes
do-ip6: yes
do-udp: yes
do-tcp: yes

root-hints: "/opt/unbound/etc/unbound/root.hints"

hide-identity: yes
hide-version: yes

harden-glue: yes
harden-dnssec-stripped: yes
harden-referral-path: yes

use-caps-for-id: yes
qname-minimisation: yes

cache-min-ttl: 300
cache-max-ttl: 86400

prefetch: yes
prefetch-key: yes

rrset-roundrobin: yes

access-control: 0.0.0.0/0 allow
